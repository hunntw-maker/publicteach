
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronos 數位觀課儀表板</title>
    <!-- Tailwind Play CDN for high-fidelity prototyping -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        klimtGold: '#f59e0b',
                        klimtRust: '#991b1b',
                    },
                    animation: {
                        'spin-slow': 'spin 10s linear infinite',
                        'fadeIn': 'fadeIn 0.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #020617; /* slate-950 */
            color: #f8fafc;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .glass {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .klimt-gradient {
            background: linear-gradient(135deg, #f59e0b 0%, #b45309 50%, #78350f 100%);
        }
        .rust-gradient {
            background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%);
        }
        @keyframes pulse-gold {
            0%, 100% { border-color: rgba(245, 158, 11, 0.1); }
            50% { border-color: rgba(245, 158, 11, 0.6); }
        }
        .animate-pulse-gold {
            animation: pulse-gold 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .log-stream-container {
            mask-image: linear-gradient(to bottom, transparent, black 8%, black 92%, transparent);
        }
        /* Mobile touch optimization */
        button:active {
            transform: scale(0.96);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body class="bg-slate-950 text-slate-50 min-h-screen selection:bg-amber-500/30 overflow-x-hidden">
    <div id="root"></div>
</body>
</html>
